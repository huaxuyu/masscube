[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "masscube"
version = "1.2.22"
authors = [
  { name="Huaxu Yu", email="yhxchem@outlook.com" },
]
maintainers = [
  { name="Huaxu Yu", email="yhxchem@outlook.com" },
]
description = "Accurate and fast data processing for metabolomics"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24,<2",
    "pandas>=2.2.1",
    "pyteomics==4.6.3",
    "scipy>=1.10.1",
    "tqdm>=4.66.1",
    "joblib>=1.3.0",
    "lxml>=4.9.3",
    "matplotlib>=3.8.2",
    "ms_entropy==1.3.4",
    "scikit-learn>=1.3.2",
    "statsmodels>=0.14.2",
    "umap-learn>=0.5.7",
    "IsoSpecPy>=2.2.3"
]

[project.scripts]
untargeted-metabolomics = "masscube:untargeted_metabolomics_workflow"
batch-processing = "masscube:batch_file_processing"
generate-sample-table = "masscube:generate_sample_table"
find-outliers = "masscube:run_evaluation"
build-classifier = "masscube:build_classifier"

[project.urls]
Homepage = "https://github.com/huaxuyu/masscube"
Documentation = "https://huaxuyu.github.io/masscubedocs/"
Source = "https://github.com/huaxuyu/masscube/"
Issues = "https://github.com/huaxuyu/masscube/issues/"

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "twine",
]

[tool.setuptools.package-data]
masscube = ["*.pyi", "py.typed"]
